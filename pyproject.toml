[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-hub"
version = "0.2.0"
description = "Local-first shared persistent memory for multiple AI tools using Obsidian + MCP"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "mcp>=2,<3",
  "pystray>=0.19,<1",
  "Pillow>=10,<13",
  "cryptography>=41",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff>=0.8,<1",
  "ty>=0.0.1,<1",
]

[project.urls]
Homepage = "https://github.com/vib28/ai-memory-hub"
Repository = "https://github.com/vib28/ai-memory-hub"

[project.scripts]
ai-memory = "memory_hub.cli:main"
ai-memory-mcp = "memory_hub.mcp_server:main"
ai-memory-dashboard = "memory_hub.dashboard:main"
ai-memory-tray = "memory_hub.tray:main"
ai-memory-app = "memory_hub.app:main"
ai-memory-hook = "memory_hub.capture:hook_main"
ai-memory-worker = "memory_hub.worker:main"
ai-memory-handoff = "memory_hub.handoff:main"
ai-memory-context = "memory_hub.context_packet:main"
ai-memory-github-export = "memory_hub.github_export:main"
ai-memory-handoff-benchmark = "memory_hub.benchmark_handoff:main"

[tool.setuptools]
packages = ["memory_hub"]

[tool.setuptools.package-data]
memory_hub = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstring (not critical for this project)
    "ANN",     # type annotations (gradual typing)
    "FIX",     # FIXME comments (we use GitHub issues)
    "TD",      # TODO comments
    "ERA",     # commented-out code (we have intentional examples)
    "COM812",  # trailing comma (conflicts with formatter)
    "ISC001",  # implicit string concatenation
    "T201",    # print statements (we use logging)
    "TRY003",  # long messages in exceptions (we have descriptive errors)
    "EM",      # exception message formatting
    "PTH",     # pathlib (os.path is fine for now)
    "FBT",     # boolean traps
    "A",       # shadowing builtins
    "RUF001",  # ambiguous unicode characters
    "RUF002",  # ambiguous unicode characters
    "RUF012",  # mutable class attributes
    "S",       # bandit security (we have our own security module)
    "NPY",     # numpy (we don't use numpy)
    "PD",      # pandas (we don't use pandas)
    "PIE",     # misc lints
    "Q",       # quotes (we use double quotes consistently
    "C4",      # comprehensions (we use explicit loops for clarity
    "RET",     # return statements
    "SLF",     # self (we use self consistently
    "SIM",     # simplify (we prefer explicit code
    "UP",      # pyupgrade (we target py310
    "NPY",     # numpy
    "PD",      # pandas
    "PL",      # pylint
    "PGH",     # pygrep hooks
    "TRY",     # tryceratops
    "FLY",     # flynt
    "PERF",    # perflint
    "FURB",    # refurb
    "DOC",     # docstrings
    "CPY",     # copyright
]
