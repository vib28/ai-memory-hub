[package]
name = "ai-memory-hub-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "ai_memory_hub_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
lazy_static = "1"
parking_lot = "0.12"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
